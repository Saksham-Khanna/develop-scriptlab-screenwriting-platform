<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f13"/>
      <stop offset="100%" stop-color="#14161c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Commercial spec concept: billboard frame -->
  <g opacity="0.5">
    <!-- Billboard rectangle -->
    <rect x="150" y="80" width="500" height="260" rx="6" fill="none" stroke="#c9a24d" stroke-width="2"/>
    <!-- Billboard legs -->
    <line x1="280" y1="340" x2="260" y2="400" stroke="#c9a24d" stroke-width="2" opacity="0.6"/>
    <line x1="520" y1="340" x2="540" y2="400" stroke="#c9a24d" stroke-width="2" opacity="0.6"/>

    <!-- Inner content area -->
    <rect x="170" y="100" width="460" height="220" rx="2" fill="#0d0f13"/>
    <!-- Concept sketch lines -->
    <text x="400" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#f4f1ea" opacity="0.6" letter-spacing="6">THE HOOK</text>
    <text x="400" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#c9a24d" opacity="0.5" letter-spacing="4">30 SECONDS TO CHANGE EVERYTHING</text>

    <!-- Divider -->
    <rect x="200" y="210" width="400" height="1" fill="#c9a24d" opacity="0.2"/>

    <!-- Storyboard mini frames -->
    <rect x="195" y="225" width="90" height="70" rx="2" fill="none" stroke="#c9a24d" stroke-width="1" opacity="0.6"/>
    <rect x="300" y="225" width="90" height="70" rx="2" fill="none" stroke="#c9a24d" stroke-width="1" opacity="0.6"/>
    <rect x="405" y="225" width="90" height="70" rx="2" fill="none" stroke="#c9a24d" stroke-width="1" opacity="0.6"/>
    <rect x="510" y="225" width="90" height="70" rx="2" fill="none" stroke="#c9a24d" stroke-width="1" opacity="0.6"/>

    <!-- Scene numbers -->
    <text x="240" y="302" text-anchor="middle" font-family="system-ui" font-size="9" fill="#c9a24d" opacity="0.5">01</text>
    <text x="345" y="302" text-anchor="middle" font-family="system-ui" font-size="9" fill="#c9a24d" opacity="0.5">02</text>
    <text x="450" y="302" text-anchor="middle" font-family="system-ui" font-size="9" fill="#c9a24d" opacity="0.5">03</text>
    <text x="555" y="302" text-anchor="middle" font-family="system-ui" font-size="9" fill="#c9a24d" opacity="0.5">04</text>
  </g>

  <rect x="80" y="430" width="640" height="1" fill="url(#gold)" opacity="0.4"/>
  <text x="400" y="460" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f4f1ea" letter-spacing="4" opacity="0.9">COMMERCIAL SPEC</text>
  <text x="400" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="6" opacity="0.8">LOGLINE &#xB7; PITCH &#xB7; HOOK &#xB7; SCRIPTLAB</text>
</svg>
