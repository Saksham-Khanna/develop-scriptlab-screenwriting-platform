<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f13"/>
      <stop offset="100%" stop-color="#14161c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Speech bubble &#8212; left (dialogue A) -->
  <g opacity="0.5">
    <rect x="80" y="90" width="300" height="100" rx="12" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <polygon points="160,190 130,220 190,190" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <!-- fake text lines -->
    <rect x="105" y="115" width="250" height="5" rx="2" fill="#c9a24d" opacity="0.4"/>
    <rect x="105" y="130" width="220" height="5" rx="2" fill="#c9a24d" opacity="0.4"/>
    <rect x="105" y="145" width="180" height="5" rx="2" fill="#c9a24d" opacity="0.4"/>
    <rect x="105" y="160" width="130" height="5" rx="2" fill="#c9a24d" opacity="0.25"/>
  </g>

  <!-- Speech bubble &#8212; right (dialogue B) -->
  <g opacity="0.5">
    <rect x="420" y="210" width="300" height="100" rx="12" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <polygon points="640,210 610,180 670,210" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <rect x="445" y="235" width="250" height="5" rx="2" fill="#c9a24d" opacity="0.4"/>
    <rect x="445" y="250" width="200" height="5" rx="2" fill="#c9a24d" opacity="0.4"/>
    <rect x="445" y="265" width="230" height="5" rx="2" fill="#c9a24d" opacity="0.4"/>
    <rect x="445" y="280" width="150" height="5" rx="2" fill="#c9a24d" opacity="0.25"/>
  </g>

  <!-- Subtext underline wavy line -->
  <path d="M 150 340 Q 200 330 250 340 Q 300 350 350 340 Q 400 330 450 340 Q 500 350 550 340 Q 600 330 650 340" fill="none" stroke="#c9a24d" stroke-width="1" opacity="0.3" stroke-dasharray="2,3"/>
  <text x="400" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="5" opacity="0.5">SUBTEXT</text>

  <rect x="80" y="410" width="640" height="1" fill="url(#gold)" opacity="0.4"/>
  <text x="400" y="445" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f4f1ea" letter-spacing="4" opacity="0.9">DIALOGUE &amp; SCENE</text>
  <text x="400" y="465" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="6" opacity="0.8">SUBTEXT &#xB7; CONFLICT &#xB7; SCRIPTLAB</text>
</svg>
