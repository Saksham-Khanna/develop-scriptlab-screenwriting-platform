<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="100%" stop-color="#14161c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Writers' room table (top down view) -->
  <g opacity="0.5">
    <!-- Oval table -->
    <ellipse cx="400" cy="230" rx="240" ry="130" fill="none" stroke="#c9a24d" stroke-width="2"/>
    <!-- Table surface hint -->
    <ellipse cx="400" cy="230" rx="230" ry="120" fill="#0d0f13" opacity="0.5"/>

    <!-- Cards on table -->
    <rect x="350" y="190" width="50" height="35" rx="2" fill="none" stroke="#c9a24d" stroke-width="1" opacity="0.5"/>
    <rect x="310" y="215" width="50" height="35" rx="2" fill="none" stroke="#c9a24d" stroke-width="1" opacity="0.5" transform="rotate(-15,335,232)"/>
    <rect x="420" y="210" width="50" height="35" rx="2" fill="none" stroke="#c9a24d" stroke-width="1" opacity="0.5" transform="rotate(10,445,227)"/>

    <!-- Writers around table (dots) -->
    <circle cx="400" cy="90" r="12" fill="none" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>
    <circle cx="260" cy="140" r="12" fill="none" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>
    <circle cx="180" cy="230" r="12" fill="none" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>
    <circle cx="260" cy="320" r="12" fill="none" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>
    <circle cx="400" cy="368" r="12" fill="none" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>
    <circle cx="540" cy="320" r="12" fill="none" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>
    <circle cx="620" cy="230" r="12" fill="none" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>
    <circle cx="540" cy="140" r="12" fill="none" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>

    <!-- Whiteboard (top of image) -->
    <rect x="260" y="30" width="280" height="45" rx="3" fill="none" stroke="#c9a24d" stroke-width="1" opacity="0.4"/>
    <text x="400" y="60" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#c9a24d" opacity="0.5" letter-spacing="2">ACT TWO BREAK?</text>
  </g>

  <rect x="80" y="430" width="640" height="1" fill="url(#gold)" opacity="0.4"/>
  <text x="400" y="460" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f4f1ea" letter-spacing="4" opacity="0.9">THE WRITERS' ROOM</text>
  <text x="400" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="6" opacity="0.8">COLLABORATION &#xB7; PITCHING &#xB7; NOTES &#xB7; SCRIPTLAB</text>
</svg>
