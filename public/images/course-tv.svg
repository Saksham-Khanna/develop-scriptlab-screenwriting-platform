<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="100%" stop-color="#161820"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- TV set outline -->
  <g opacity="0.5">
    <rect x="180" y="80" width="440" height="280" rx="12" fill="none" stroke="#c9a24d" stroke-width="2"/>
    <!-- Screen bezel -->
    <rect x="200" y="100" width="400" height="240" rx="4" fill="#0d0f13"/>
    <!-- Screen reflection lines -->
    <line x1="220" y1="120" x2="380" y2="120" stroke="#c9a24d" stroke-width="0.5" opacity="0.2"/>
    <line x1="220" y1="135" x2="560" y2="135" stroke="#c9a24d" stroke-width="0.5" opacity="0.15"/>

    <!-- Script-on-screen lines -->
    <text x="400" y="195" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#f4f1ea" opacity="0.5" letter-spacing="2">INT. WRITERS' ROOM - DAY</text>
    <rect x="230" y="210" width="340" height="4" rx="2" fill="#c9a24d" opacity="0.25"/>
    <rect x="230" y="225" width="300" height="4" rx="2" fill="#f4f1ea" opacity="0.15"/>
    <rect x="230" y="240" width="320" height="4" rx="2" fill="#f4f1ea" opacity="0.15"/>
    <rect x="310" y="258" width="180" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>
    <rect x="230" y="275" width="300" height="4" rx="2" fill="#f4f1ea" opacity="0.15"/>
    <rect x="230" y="290" width="260" height="4" rx="2" fill="#f4f1ea" opacity="0.15"/>
    <rect x="230" y="305" width="310" height="4" rx="2" fill="#f4f1ea" opacity="0.15"/>

    <!-- TV stand -->
    <rect x="360" y="360" width="80" height="20" rx="4" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <rect x="310" y="378" width="180" height="10" rx="4" fill="none" stroke="#c9a24d" stroke-width="1.5"/>

    <!-- Antenna -->
    <line x1="350" y1="80" x2="310" y2="30" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>
    <line x1="450" y1="80" x2="490" y2="30" stroke="#c9a24d" stroke-width="1.5" opacity="0.6"/>
  </g>

  <rect x="80" y="430" width="640" height="1" fill="url(#gold)" opacity="0.4"/>
  <text x="400" y="460" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f4f1ea" letter-spacing="4" opacity="0.9">TV WRITING</text>
  <text x="400" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="6" opacity="0.8">SERIES &#xB7; PILOTS &#xB7; ROOM DYNAMICS &#xB7; SCRIPTLAB</text>
</svg>
