<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="100%" stop-color="#161820"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Script with red pen marks (doctoring) -->
  <g opacity="0.5" transform="translate(130, 60)">
    <!-- Script page -->
    <rect x="80" y="20" width="300" height="380" rx="4" fill="#f4f1ea" opacity="0.07" stroke="#c9a24d" stroke-width="1"/>

    <!-- Script lines -->
    <rect x="100" y="50" width="260" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>
    <rect x="100" y="68" width="240" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>
    <rect x="100" y="86" width="250" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>
    <rect x="150" y="104" width="160" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>
    <rect x="100" y="122" width="260" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>
    <rect x="100" y="140" width="230" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>

    <!-- Red corrections (doctor's pen) -->
    <!-- Strikethrough line -->
    <rect x="100" y="156" width="200" height="3" rx="1" fill="#c9a24d" opacity="0.5"/>
    <line x1="98" y1="158" x2="305" y2="158" stroke="#8B0000" stroke-width="2" opacity="0.6"/>
    <!-- Insertion caret -->
    <text x="100" y="185" font-family="'Courier New',monospace" font-size="13" fill="#8B0000" opacity="0.6">^ INSERT: motivation</text>

    <rect x="100" y="200" width="250" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>
    <rect x="100" y="218" width="210" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>
    <!-- Circle margin note -->
    <circle cx="85" cy="221" r="10" fill="none" stroke="#8B0000" stroke-width="1.5" opacity="0.5"/>
    <text x="85" y="225" text-anchor="middle" font-family="system-ui" font-size="9" fill="#8B0000" opacity="0.5">?</text>

    <rect x="100" y="236" width="260" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>
    <rect x="100" y="254" width="180" height="4" rx="2" fill="#c9a24d" opacity="0.2"/>

    <!-- Pass stamp / annotation -->
    <rect x="140" y="280" width="120" height="40" rx="4" fill="none" stroke="#8B0000" stroke-width="1.5" opacity="0.4"/>
    <text x="200" y="306" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#8B0000" opacity="0.5" letter-spacing="2">NOTES: p.47</text>
  </g>

  <!-- Coverage report (right side) -->
  <g opacity="0.4" transform="translate(430, 100)">
    <rect x="0" y="0" width="250" height="300" rx="4" fill="none" stroke="#c9a24d" stroke-width="1"/>
    <text x="125" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#c9a24d" letter-spacing="3" opacity="0.8">COVERAGE</text>
    <rect x="20" y="45" width="210" height="1" fill="#c9a24d" opacity="0.3"/>
    <!-- score rows -->
    <text x="20" y="70" font-family="system-ui" font-size="9" fill="#f4f1ea" opacity="0.5" letter-spacing="1">CONCEPT</text>
    <rect x="100" y="62" width="120" height="10" rx="2" fill="#1a1d24"/>
    <rect x="100" y="62" width="96" height="10" rx="2" fill="#c9a24d" opacity="0.5"/>

    <text x="20" y="90" font-family="system-ui" font-size="9" fill="#f4f1ea" opacity="0.5" letter-spacing="1">STRUCTURE</text>
    <rect x="100" y="82" width="120" height="10" rx="2" fill="#1a1d24"/>
    <rect x="100" y="82" width="72" height="10" rx="2" fill="#c9a24d" opacity="0.5"/>

    <text x="20" y="110" font-family="system-ui" font-size="9" fill="#f4f1ea" opacity="0.5" letter-spacing="1">CHARACTER</text>
    <rect x="100" y="102" width="120" height="10" rx="2" fill="#1a1d24"/>
    <rect x="100" y="102" width="108" height="10" rx="2" fill="#c9a24d" opacity="0.5"/>

    <text x="20" y="130" font-family="system-ui" font-size="9" fill="#f4f1ea" opacity="0.5" letter-spacing="1">DIALOGUE</text>
    <rect x="100" y="122" width="120" height="10" rx="2" fill="#1a1d24"/>
    <rect x="100" y="122" width="84" height="10" rx="2" fill="#c9a24d" opacity="0.5"/>
  </g>

  <rect x="80" y="430" width="640" height="1" fill="url(#gold)" opacity="0.4"/>
  <text x="400" y="460" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f4f1ea" letter-spacing="4" opacity="0.9">SCRIPT DOCTORING</text>
  <text x="400" y="478" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="6" opacity="0.8">DIAGNOSIS &#xB7; COVERAGE &#xB7; REPAIR &#xB7; SCRIPTLAB</text>
</svg>
