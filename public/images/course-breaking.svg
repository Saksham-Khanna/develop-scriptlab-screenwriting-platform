<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#161820"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Storyboard / index cards grid -->
  <g opacity="0.5">
    <!-- Row 1 -->
    <rect x="80" y="80" width="150" height="100" rx="4" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <text x="155" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#c9a24d" letter-spacing="2" opacity="0.6">PREMISE</text>

    <rect x="260" y="80" width="150" height="100" rx="4" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <text x="335" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#c9a24d" letter-spacing="2" opacity="0.6">CONFLICT</text>

    <rect x="440" y="80" width="150" height="100" rx="4" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <text x="515" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#c9a24d" letter-spacing="2" opacity="0.6">MIDPOINT</text>

    <rect x="620" y="80" width="100" height="100" rx="4" fill="none" stroke="#c9a24d" stroke-width="0.8" opacity="0.4" stroke-dasharray="4,3"/>
    <text x="670" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#c9a24d" letter-spacing="2" opacity="0.3">?</text>

    <!-- Row 2 -->
    <rect x="80" y="210" width="150" height="100" rx="4" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <text x="155" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#c9a24d" letter-spacing="2" opacity="0.6">BREAK INTO 2</text>

    <rect x="260" y="210" width="150" height="100" rx="4" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <text x="335" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#c9a24d" letter-spacing="2" opacity="0.6">ALL IS LOST</text>

    <rect x="440" y="210" width="150" height="100" rx="4" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <text x="515" y="266" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#c9a24d" letter-spacing="2" opacity="0.6">FINALE</text>

    <!-- Connecting arrows -->
    <line x1="230" y1="130" x2="260" y2="130" stroke="#c9a24d" stroke-width="1" opacity="0.4"/>
    <line x1="410" y1="130" x2="440" y2="130" stroke="#c9a24d" stroke-width="1" opacity="0.4"/>
    <line x1="590" y1="130" x2="620" y2="130" stroke="#c9a24d" stroke-width="1" opacity="0.4"/>
    <line x1="230" y1="260" x2="260" y2="260" stroke="#c9a24d" stroke-width="1" opacity="0.4"/>
    <line x1="410" y1="260" x2="440" y2="260" stroke="#c9a24d" stroke-width="1" opacity="0.4"/>
  </g>

  <rect x="80" y="380" width="640" height="1" fill="url(#gold)" opacity="0.4"/>
  <text x="400" y="415" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f4f1ea" letter-spacing="4" opacity="0.9">STORY BREAKING</text>
  <text x="400" y="438" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="6" opacity="0.8">INDEX CARDS &#xB7; BEAT BOARD &#xB7; SCRIPTLAB</text>
</svg>
