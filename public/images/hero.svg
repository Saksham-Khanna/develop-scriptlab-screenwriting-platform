<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0c"/>
      <stop offset="45%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#12100e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#spotlight)"/>

  <!-- Film strip left -->
  <g opacity="0.18">
    <rect x="0" y="0" width="80" height="750" fill="url(#filmGrad)"/>
    <rect x="8" y="0" width="64" height="750" fill="#0a0b0d"/>
    <!-- sprocket holes -->
    <rect x="12" y="20" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="70" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="120" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="170" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="220" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="270" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="320" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="370" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="420" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="470" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="520" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="570" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="620" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="670" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="12" y="720" width="56" height="30" rx="3" fill="#1a1d24"/>
  </g>

  <!-- Film strip right -->
  <g opacity="0.18">
    <rect x="1120" y="0" width="80" height="750" fill="url(#filmGrad)"/>
    <rect x="1128" y="0" width="64" height="750" fill="#0a0b0d"/>
    <rect x="1132" y="20" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="70" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="120" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="170" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="220" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="270" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="320" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="370" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="420" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="470" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="520" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="570" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="620" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="670" width="56" height="30" rx="3" fill="#1a1d24"/>
    <rect x="1132" y="720" width="56" height="30" rx="3" fill="#1a1d24"/>
  </g>

  <!-- Script pages fanned out (right side) -->
  <g opacity="0.22">
    <rect x="750" y="80" width="300" height="420" rx="4" fill="#f4f1ea" transform="rotate(-8, 900, 290)"/>
    <rect x="760" y="80" width="300" height="420" rx="4" fill="#ede8de" transform="rotate(-3, 910, 290)"/>
    <rect x="770" y="80" width="300" height="420" rx="4" fill="#f4f1ea" transform="rotate(2, 920, 290)"/>
  </g>

  <!-- Script page foreground -->
  <g opacity="0.55" transform="rotate(5, 920, 310)">
    <rect x="790" y="90" width="290" height="410" rx="4" fill="#f4f1ea"/>
    <!-- Script lines -->
    <rect x="830" y="130" width="200" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="145" width="180" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="160" width="210" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="890" y="180" width="90" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="200" width="200" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="215" width="160" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="890" y="235" width="90" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="255" width="200" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="270" width="185" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="290" width="90" height="4" rx="2" fill="#c9a24d" opacity="0.5"/>
    <rect x="830" y="310" width="200" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="325" width="170" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="890" y="345" width="90" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="365" width="200" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="380" width="140" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="400" width="200" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="415" width="195" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="435" width="90" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
    <rect x="830" y="455" width="200" height="4" rx="2" fill="#b8a890" opacity="0.6"/>
  </g>

  <!-- Typewriter / pen accent -->
  <g opacity="0.3" transform="translate(680, 380)">
    <!-- Pen nib -->
    <polygon points="0,0 8,40 16,0" fill="#c9a24d"/>
    <rect x="5" y="-80" width="6" height="80" rx="3" fill="#c9a24d"/>
    <ellipse cx="8" cy="-80" rx="10" ry="6" fill="#8a7040"/>
  </g>

  <!-- Gold horizontal rule -->
  <rect x="100" y="370" width="500" height="1" fill="url(#glow)" opacity="0.5"/>

  <!-- Clapper board (top right corner hint) -->
  <g opacity="0.2" transform="translate(1000, 20) rotate(-10)">
    <rect x="0" y="30" width="140" height="90" rx="4" fill="#1a1d24" stroke="#c9a24d" stroke-width="1.5"/>
    <rect x="0" y="10" width="140" height="25" rx="4" fill="#c9a24d"/>
    <!-- Clapper lines -->
    <line x1="0" y1="10" x2="20" y2="35" stroke="#090a0c" stroke-width="8"/>
    <line x1="35" y1="10" x2="55" y2="35" stroke="#090a0c" stroke-width="8"/>
    <line x1="70" y1="10" x2="90" y2="35" stroke="#090a0c" stroke-width="8"/>
    <line x1="105" y1="10" x2="125" y2="35" stroke="#090a0c" stroke-width="8"/>
  </g>

  <!-- ScriptLab wordmark -->
  <text x="140" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#f4f1ea" letter-spacing="8" font-weight="400" opacity="0.95">SCRIPTLAB</text>
  <text x="142" y="340" font-family="system-ui, 'Helvetica Neue', sans-serif" font-size="13" fill="#c9a24d" letter-spacing="12" text-transform="uppercase" opacity="0.9">CINEMATIC MASTERCLASS</text>

  <!-- Decorative circle -->
  <circle cx="600" cy="375" r="280" fill="none" stroke="#c9a24d" stroke-width="0.5" opacity="0.08"/>
  <circle cx="600" cy="375" r="200" fill="none" stroke="#c9a24d" stroke-width="0.5" opacity="0.06"/>
</svg>
