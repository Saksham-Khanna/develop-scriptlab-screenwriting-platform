<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12"/>
      <stop offset="100%" stop-color="#161820"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a24d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a24d"/>
      <stop offset="100%" stop-color="#c9a24d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Character silhouette (central figure) -->
  <g opacity="0.5">
    <!-- Body -->
    <ellipse cx="400" cy="175" rx="40" ry="45" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <!-- Head -->
    <circle cx="400" cy="120" r="28" fill="none" stroke="#c9a24d" stroke-width="1.5"/>
    <!-- Arms -->
    <line x1="360" y1="195" x2="300" y2="265" stroke="#c9a24d" stroke-width="1.5" opacity="0.7"/>
    <line x1="440" y1="195" x2="490" y2="250" stroke="#c9a24d" stroke-width="1.5" opacity="0.7"/>
    <!-- Legs -->
    <line x1="385" y1="220" x2="360" y2="310" stroke="#c9a24d" stroke-width="1.5" opacity="0.7"/>
    <line x1="415" y1="220" x2="440" y2="310" stroke="#c9a24d" stroke-width="1.5" opacity="0.7"/>

    <!-- WANT label -->
    <text x="265" y="230" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="3" text-anchor="middle" opacity="0.9">WANT</text>
    <line x1="295" y1="232" x2="325" y2="225" stroke="#c9a24d" stroke-width="0.8" stroke-dasharray="3,2"/>

    <!-- NEED label -->
    <text x="535" y="225" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="3" text-anchor="middle" opacity="0.9">NEED</text>
    <line x1="510" y1="225" x2="475" y2="220" stroke="#c9a24d" stroke-width="0.8" stroke-dasharray="3,2"/>

    <!-- LIE label -->
    <text x="400" y="75" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="3" text-anchor="middle" opacity="0.9">LIE</text>
    <line x1="400" y1="80" x2="400" y2="92" stroke="#c9a24d" stroke-width="0.8" stroke-dasharray="3,2"/>

    <!-- WOUND label -->
    <text x="400" y="360" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="3" text-anchor="middle" opacity="0.9">WOUND</text>
    <line x1="400" y1="350" x2="400" y2="315" stroke="#c9a24d" stroke-width="0.8" stroke-dasharray="3,2"/>

    <!-- Orbiting ring -->
    <ellipse cx="400" cy="210" rx="130" ry="130" fill="none" stroke="#c9a24d" stroke-width="0.5" opacity="0.2" stroke-dasharray="4,6"/>
  </g>

  <rect x="80" y="410" width="640" height="1" fill="url(#gold)" opacity="0.4"/>
  <text x="400" y="445" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f4f1ea" letter-spacing="4" opacity="0.9">CHARACTER DESIGN</text>
  <text x="400" y="465" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#c9a24d" letter-spacing="6" opacity="0.8">WANT &#xB7; NEED &#xB7; LIE &#xB7; WOUND &#xB7; SCRIPTLAB</text>
</svg>
